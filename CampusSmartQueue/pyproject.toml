[project]
name = "campus-smartqueue"
version = "2.0.0"
description = "Campus SmartQueue 2.0 API"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "httpx>=0.27.0"
]

[tool.vercel]
entrypoint = "main:app"
